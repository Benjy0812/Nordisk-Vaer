<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nordisk Vær</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2v20M2 12h20M4.9 4.9l14.2 14.2M19.1 4.9L4.9 19.1' stroke='%2338bdf8' stroke-width='2.5' stroke-linecap='round'/></svg>"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body
    class="flex min-h-screen flex-col text-center font-[Arial,Helvetica,sans-serif]"
  >
    <header>
      <h1 class="mx-auto my-2.5">Nordisk Vær</h1>
      <!-- Search boxes. The IDs here are used in main.js, don't rename them -->
      <form
        id="weather-form"
        class="mx-auto my-0 flex max-w-125 flex-wrap items-end justify-center gap-2 p-2"
      >
        <div class="flex flex-col">
          <label class="text-sm font-bold" for="location-input">Lokasjon</label>
          <input
            class="m-0 h-10 min-w-30 rounded border border-neutral-300 p-2"
            type="text"
            id="location-input"
            placeholder="Lokasjon"
          />
        </div>
        <button
          class="m-0 flex h-10 rounded border border-neutral-300 bg-white px-3 py-2 hover:cursor-pointer hover:bg-zinc-100"
          id="fetch-button"
          type="submit"
        >
          Hent
        </button>
        <div class="flex flex-col">
          <label class="text-sm font-bold" for="temp-toggle"
            >Temperaturenhet</label
          >
          <select
            class="h-10 w-auto rounded border border-neutral-300 text-center"
            id="temp-toggle"
          >
            <option value="Celsius">°C</option>
            <option value="Fahrenheit">°F</option>
          </select>
        </div>
      </form>
      <!-- Error message. Hidden until something goes wrong -->
      <p
        id="search-error"
        class="mx-auto my-2 inline-block max-w-125 rounded border-4 border-red-500/50 bg-red-500/25 p-2 font-bold text-red-600"
        role="alert"
        hidden
      ></p>
      <p id="initial-message" class="p-2">Søk etter et sted for å se været</p>
    </header>
    <!-- Weather results. Hidden until the first search works -->
    <main id="weather-info" hidden>
      <p class="mx-auto my-2.5 font-bold" id="location-title"></p>
      <div
        class="inline-flex transform-gpu flex-col items-center gap-2 will-change-transform *:cursor-pointer *:transition-transform *:duration-100 *:hover:scale-125"
        aria-label="Værdata"
        role="group"
      >
        <p
          class="m-0 inline-block w-fit rounded p-1.25 font-bold shadow-md"
          id="temp"
        ></p>
        <p
          class="m-0 inline-block w-fit rounded p-1.25 font-bold shadow-md"
          id="pressure"
        ></p>
        <p
          class="m-0 inline-block w-fit rounded p-1.25 font-bold shadow-md"
          id="humidity"
        ></p>
        <p
          class="m-0 inline-block w-fit rounded p-1.25 font-bold shadow-md"
          id="clouds"
        ></p>
        <p
          class="m-0 inline-block w-fit rounded p-1.25 font-bold shadow-md"
          id="wind"
        ></p>
        <p
          class="m-0 inline-block w-fit rounded p-1.25 font-bold shadow-md"
          id="symbol"
        ></p>
      </div>
      <div class="flex flex-col items-center gap-2">
        <br />
        <p class="text-2xl font-bold">Vindretning:</p>
        <canvas
          class="rounded-2xl border border-gray-500"
          id="arrow"
          width="100"
          height="100"
          aria-hidden="true"
        ></canvas>
      </div>
    </main>
    <!-- Credits. Required by MET and Nominatim terms, keep visible -->
    <footer class="mt-auto flex flex-col items-center gap-1 p-2 text-sm">
      <p>
        &copy; 2026 Værdata fra
        <a
          class="text-blue-600 underline hover:text-blue-800"
          href="https://www.met.no/"
          target="_blank"
          >MET Norway</a
        >
      </p>
      <p>
        Stedsdata &copy;
        <a
          class="text-blue-600 underline hover:text-blue-800"
          href="https://www.openstreetmap.org/copyright"
          target="_blank"
          >OpenStreetMap-bidragsytere</a
        >
      </p>
      <p>Koden er lisensiert under MIT.</p>
    </footer>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
